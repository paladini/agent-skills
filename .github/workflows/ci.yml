name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test article validator
        run: python -m unittest discover -s skills/devto-publish-expert/scripts -p "test_*.py"
      - name: Check skill front matter
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("skills/devto-publish-expert/SKILL.md").read_text()
          assert text.startswith("---\nname: devto-publish-expert\n")
          assert "\ndescription:" in text.split("\n---\n", 1)[0]
          print("Skill front matter OK")
          PY
